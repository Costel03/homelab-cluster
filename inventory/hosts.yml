---
# The nodes are listed here before they exist — the addresses below are what
# the VMs will be given, not what they currently have. playbooks/vms.yml
# creates them, then waits for SSH on exactly these addresses.
#
# To change a node's size, edit its file in host_vars/. To add a node, add it
# here and in host_vars/, then re-run: nothing else needs touching.

all:
  children:
    k8s_nodes:
      children:
        masters:
          hosts:
            master:
              ansible_host: 192.168.56.10
        workers:
          hosts:
            worker1:
              ansible_host: 192.168.56.11
            worker2:
              ansible_host: 192.168.56.12
