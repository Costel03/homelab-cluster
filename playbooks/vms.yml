---
# Host-side prep runs once. It cannot live in the node play: with serial: 1
# that play has one host per batch, so run_once would fire once per node.
- name: Prepare the host
  hosts: localhost
  gather_facts: false
  connection: local
  roles:
  - ssh_keys
  - vm_image

- name: Create the VirtualBox VMs
  hosts: k8s_nodes
  gather_facts: false
  # VBoxManage runs on the Windows host, driven from WSL.
  connection: local
  serial: 1
  vars:
    vm_name: "{{ inventory_hostname }}"
    vm_ip: "{{ ansible_host }}"
    vbox_vm_dir: "{{ hostvars['localhost'].vbox_vm_dir }}"
    base_vdi: "{{ hostvars['localhost'].base_vdi }}"
    ssh_public_key: "{{ hostvars['localhost'].homelab_public_key }}"
  roles:
  - virtualbox_vm

- name: Wait for the nodes to answer
  hosts: k8s_nodes
  gather_facts: false
  tasks:
  # Two stages so a failure says which half broke: no port means the VM did
  # not boot or cloud-init never brought the NIC up; port but no connection
  # means SSH or the key is wrong.
  - name: Wait for port 22
    ansible.builtin.wait_for:
      host: "{{ ansible_host }}"
      port: 22
      timeout: 1200
      delay: 10
    delegate_to: localhost

  - name: Wait for Ansible to be able to run on the node
    ansible.builtin.wait_for_connection:
      timeout: 300

  - name: Gather facts now that the node is up
    ansible.builtin.setup:
