---
# Host-side prep runs once. It cannot live in the node play: with serial: 1
# that play has one host per batch, so run_once would fire once per node.
- name: Prepare the host
  hosts: localhost
  gather_facts: false
  connection: local
  roles:
  - ssh_keys
  - vm_image

- name: Create the VirtualBox VMs
  hosts: k8s_nodes
  gather_facts: false
  serial: 1
  vars:
    vm_name: "{{ inventory_hostname }}"
    vm_ip: "{{ hostvars[inventory_hostname].ansible_host }}"
    vbox_vm_dir: "{{ hostvars['localhost'].vbox_vm_dir }}"
    base_vdi: "{{ hostvars['localhost'].base_vdi }}"
    ssh_public_key: "{{ hostvars['localhost'].homelab_public_key }}"
  tasks:
  # VBoxManage runs on the Windows host, so these tasks are delegated rather
  # than the play being given connection: local. A play-level connection: local
  # leaves the connection cached as local for these hosts, and every
  # wait_for_connection in a later play then fails with "timed out waiting for
  # ping module test" even though SSH is perfectly healthy.
  - name: Create the VM without starting it
    ansible.builtin.include_role:
      name: virtualbox_vm
      apply:
        delegate_to: localhost
    vars:
      vm_autostart: false

# Started only once every disk is cloned, and one at a time: each VM must
# answer on SSH before the next one starts. VirtualBox runs on top of Hyper-V
# here (WSL2 owns VT-x), and in that mode Linux guests that boot at the same
# time stall — the APIC timer VirtualBox emulates stops firing, so the kernel
# spins in its RAID6 benchmark or logs RCU stalls, and VBox.log shows
# "TM: Giving up catch-up attempt". A VM that wedges anyway is reset.
- name: Boot the VMs one at a time
  hosts: k8s_nodes
  gather_facts: false
  serial: 1
  tasks:
  - name: Boot it, resetting it if it stalls
    ansible.builtin.include_tasks: tasks/boot_vm.yml
    loop: "{{ range(1, vm_boot_attempts + 1) | list }}"
    loop_control:
      loop_var: boot_attempt
    when: not (vm_booted | default(false))

  - name: Stop if it never came up
    ansible.builtin.assert:
      that: vm_booted | default(false)
      fail_msg: >-
        {{ inventory_hostname }} did not answer on SSH after {{ vm_boot_attempts }} boots.
        Screenshot its console to see where it stopped:
        VBoxManage controlvm {{ inventory_hostname }} screenshotpng shot.png
      quiet: true

- name: Wait for the nodes to answer
  hosts: k8s_nodes
  gather_facts: false
  tasks:
  # Port 22 is already open (the boot play waited for it); a failure here
  # means SSH itself or the key is wrong.
  - name: Wait for Ansible to be able to run on the node
    ansible.builtin.wait_for_connection:
      timeout: 300

  - name: Gather facts now that the node is up
    ansible.builtin.setup:
