---
# Host-side prep runs once. It cannot live in the node play: with serial: 1
# that play has one host per batch, so run_once would fire once per node.
- name: Prepare the host
  hosts: localhost
  gather_facts: false
  connection: local
  roles:
  - ssh_keys
  - vm_image

- name: Create the VirtualBox VMs
  hosts: k8s_nodes
  gather_facts: false
  serial: 1
  vars:
    vm_name: "{{ inventory_hostname }}"
    vm_ip: "{{ hostvars[inventory_hostname].ansible_host }}"
    vbox_vm_dir: "{{ hostvars['localhost'].vbox_vm_dir }}"
    base_vdi: "{{ hostvars['localhost'].base_vdi }}"
    ssh_public_key: "{{ hostvars['localhost'].homelab_public_key }}"
  tasks:
  # VBoxManage runs on the Windows host, so these tasks are delegated rather
  # than the play being given connection: local. A play-level connection: local
  # leaves the connection cached as local for these hosts, and every
  # wait_for_connection in a later play then fails with "timed out waiting for
  # ping module test" even though SSH is perfectly healthy.
  - name: Create the VM without starting it
    ansible.builtin.include_role:
      name: virtualbox_vm
      apply:
        delegate_to: localhost
    vars:
      vm_autostart: false

# Started only once every disk is cloned, and staggered so three simultaneous
# boots do not recreate the same I/O storm.
- name: Start the VMs
  hosts: k8s_nodes
  gather_facts: false
  serial: 1
  tasks:
  - name: List running VMs
    ansible.builtin.command:
      argv: ['{{ vbox_manage }}', list, runningvms]
    register: running_now
    changed_when: false
    delegate_to: localhost

  - name: Start it
    ansible.builtin.command:
      argv: ['{{ vbox_manage }}', startvm, '{{ inventory_hostname }}', --type, headless]
    delegate_to: localhost
    when: running_now.stdout_lines | select('match', '^"' ~ inventory_hostname ~ '"') | list | length == 0

  - name: Give it a head start before the next one boots
    ansible.builtin.pause:
      seconds: 20
    delegate_to: localhost

- name: Wait for the nodes to answer
  hosts: k8s_nodes
  gather_facts: false
  tasks:
  # Two stages so a failure says which half broke: no port means the VM did
  # not boot or cloud-init never brought the NIC up; port but no connection
  # means SSH or the key is wrong.
  - name: Wait for port 22
    ansible.builtin.wait_for:
      host: "{{ hostvars[inventory_hostname].ansible_host }}"
      port: 22
      timeout: 1200
      delay: 10
    delegate_to: localhost

  - name: Wait for Ansible to be able to run on the node
    ansible.builtin.wait_for_connection:
      timeout: 300

  - name: Gather facts now that the node is up
    ansible.builtin.setup:
