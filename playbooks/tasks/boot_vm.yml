---
# One boot attempt for one VM: start it if it is off, reset it if a previous
# attempt left it wedged, then wait for SSH. Sets vm_booted.

- name: Check whether it is running
  ansible.builtin.command:
    argv: ['{{ vbox_manage }}', list, runningvms]
  register: running_now
  changed_when: false
  delegate_to: localhost

- name: Start it
  ansible.builtin.command:
    argv: ['{{ vbox_manage }}', startvm, '{{ inventory_hostname }}', --type, headless]
  delegate_to: localhost
  changed_when: true
  when: running_now.stdout_lines | select('match', '^"' ~ inventory_hostname ~ '"') | list | length == 0

- name: Reset it after a stalled boot, attempt {{ boot_attempt }}
  ansible.builtin.command:
    argv: ['{{ vbox_manage }}', controlvm, '{{ inventory_hostname }}', reset]
  delegate_to: localhost
  changed_when: true
  when:
  - boot_attempt > 1
  - running_now.stdout_lines | select('match', '^"' ~ inventory_hostname ~ '"') | list | length > 0

- name: Wait for SSH, attempt {{ boot_attempt }}
  ansible.builtin.wait_for:
    host: "{{ hostvars[inventory_hostname].ansible_host }}"
    port: 22
    timeout: "{{ vm_boot_timeout }}"
    delay: 5
  delegate_to: localhost
  register: vm_ssh
  # A timeout is an outcome here, not an error: the next attempt resets the VM.
  failed_when: false

- name: Remember whether it came up
  ansible.builtin.set_fact:
    vm_booted: "{{ 'Timeout' not in (vm_ssh.msg | default('')) }}"
