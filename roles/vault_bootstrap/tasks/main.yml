---
# Vault comes up sealed and empty. Initialising and unsealing it cannot be
# declarative — the unseal key only exists once, at init — so it happens here
# rather than in the GitOps repo.

- name: Wait for ArgoCD to create the Vault pod
  ansible.builtin.command:
    argv: [kubectl, get, pod, hashicorp-vault-0, -n, hashicorp-vault]
  register: vault_pod
  retries: 60
  delay: 10
  until: vault_pod.rc == 0
  changed_when: false

# Running, not Ready: an uninitialised or sealed Vault fails the chart's
# default readiness probe, so waiting for Ready here could never succeed.
- name: Wait for the Vault container to be running
  ansible.builtin.command:
    argv: [kubectl, wait, pod/hashicorp-vault-0, -n, hashicorp-vault, '--for=jsonpath={.status.phase}=Running', --timeout=300s]
  changed_when: false

- name: Wait for the Vault API to answer
  ansible.builtin.command:
    argv: [kubectl, exec, -n, hashicorp-vault, hashicorp-vault-0, --, vault, status, -format=json]
  register: vault_up
  # 0 unsealed, 2 sealed; anything else means the server is not listening yet.
  until: vault_up.rc in [0, 2]
  retries: 30
  delay: 5
  failed_when: false
  changed_when: false

- name: Parse its status
  ansible.builtin.set_fact:
    vault_state: "{{ vault_up.stdout | from_json if vault_up.rc in [0, 2] else {} }}"

- name: Stop if Vault never answered
  ansible.builtin.fail:
    msg: "vault status kept failing (rc={{ vault_up.rc }}): {{ vault_up.stderr | default('') }}"
  when: vault_up.rc not in [0, 2]

- name: Initialise Vault
  when: not (vault_state.initialized | default(false))
  block:
  - name: Run vault operator init
    ansible.builtin.command:
      argv:
      - kubectl
      - exec
      - -n
      - hashicorp-vault
      - hashicorp-vault-0
      - --
      - vault
      - operator
      - init
      - -key-shares=1
      - -key-threshold=1
      - -format=json
    register: vault_init
    changed_when: true
    no_log: true

  - name: Save the keys
    ansible.builtin.copy:
      content: "{{ vault_init.stdout }}"
      dest: "{{ vault_init_file }}"
      mode: '0600'
      # Keeps the keys of a previous cluster's Vault instead of overwriting them.
      backup: true
    no_log: true

- name: Fail early if Vault is initialised but the keys are gone
  ansible.builtin.stat:
    path: "{{ vault_init_file }}"
  register: vault_keys
  failed_when: not vault_keys.stat.exists

- name: Load the keys
  ansible.builtin.slurp:
    src: "{{ vault_init_file }}"
  register: vault_keys_raw
  no_log: true

- name: Extract the root token and unseal key
  ansible.builtin.set_fact:
    vault_root_token: "{{ (vault_keys_raw.content | b64decode | from_json).root_token }}"
    vault_unseal_key: "{{ (vault_keys_raw.content | b64decode | from_json).unseal_keys_b64[0] }}"
  no_log: true

- name: Unseal Vault
  ansible.builtin.command:
    argv: [kubectl, exec, -n, hashicorp-vault, hashicorp-vault-0, --, vault, operator, unseal, "{{ vault_unseal_key }}"]
  when: vault_state.sealed | default(true)
  changed_when: true
  no_log: true

# ESO authenticates to Vault with this; the auto-unseal Deployment uses the
# unseal key after a host reboot. Server-side apply, so the values are not
# copied into a kubectl.kubernetes.io/last-applied-configuration annotation.
- name: Create the Vault access secrets
  ansible.builtin.command:
    argv: [kubectl, apply, --server-side, --field-manager=homelab-cluster, -f, '-']
    stdin: "{{ lookup('ansible.builtin.template', 'vault-secrets.yaml.j2') }}"
  register: vault_secrets_apply
  changed_when: true
  no_log: true
