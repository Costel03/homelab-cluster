---
# Runs against a stock Ubuntu cloud image: cloud-init only creates the user and
# the static IP, so everything below — containerd, the Kubernetes packages,
# sysctl, kernel modules, registry mirrors — is installed here on first run.

- name: Stop unattended-upgrades so it cannot hold the apt lock mid-run
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: stopped
    enabled: false
  failed_when: false

- name: Install nfs-common
  ansible.builtin.apt:
    name: nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Disable swap at runtime
  ansible.builtin.command: swapoff -a
  changed_when: false

- name: Keep swap off across reboots
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

# Loaded now and on every boot. Without the modules-load.d entry a rebooted
# node comes up without br_netfilter and the bridge sysctls below fail.
- name: Load the kernel modules Kubernetes networking needs
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: [overlay, br_netfilter]

- name: Load them on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'

- name: Write Kubernetes sysctl config
  ansible.builtin.copy:
    dest: /etc/sysctl.d/kubernetes.conf
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables  = 1
      net.ipv4.ip_forward                 = 1
    mode: '0644'
  notify: Apply sysctl

- name: Apply sysctl before anything depends on it
  ansible.builtin.meta: flush_handlers

# ── Container runtime + Kubernetes packages ──────────────────────────────────
- name: Create apt keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker apt signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: false

- name: Add Docker apt repository (containerd.io only)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable\n"
    mode: '0644'

- name: Download Kubernetes apt signing key
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/{{ kubernetes_series }}/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: '0644'
    force: false

- name: Add Kubernetes apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_series }}/deb/ /\n"
    mode: '0644'

- name: Install containerd.io and Kubernetes packages
  ansible.builtin.apt:
    name:
    - containerd.io
    - kubelet
    - kubeadm
    - kubectl
    # crictl: the only way to see why a static pod is failing when the
    # apiserver itself is the thing that is down.
    - cri-tools
    state: present
    update_cache: true
    lock_timeout: 300
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Hold Kubernetes packages at the installed version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: [kubelet, kubeadm, kubectl]

# Docker's repo ships containerd 2.x, whose config format differs from 1.x.
# The template below is written for 2.x; fail loudly rather than start a
# runtime with a config it silently half-ignores.
- name: Read the containerd version
  ansible.builtin.command: containerd --version
  register: containerd_version
  changed_when: false

- name: Require containerd 2.x
  ansible.builtin.assert:
    that: containerd_version.stdout is search(' v?2\.[0-9]+')
    fail_msg: "Expected containerd 2.x from the Docker repo, got: {{ containerd_version.stdout }}"
    quiet: true

# Only the settings that differ from containerd's defaults. The previous
# approach regex-patched `containerd config default`, but 2.x writes
# config_path = '' (single quotes) and renamed sandbox_image, so the mirror
# and pause-image edits never matched and every pull bypassed Zot.
- name: Write the containerd config
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    mode: '0644'
  notify: Restart containerd

- name: Write crictl config
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
      debug: false
    mode: '0644'

# ── Container registry mirrors ───────────────────────────────────────────────
# Plain HTTP: the registry is reachable only over the host-only network, and
# using TLS here would mean distributing the homelab CA to every node before
# the first image pull — the bootstrap circle Zot-on-the-host exists to break.
# containerd falls back to the upstream when Zot is unreachable.
- name: Create a certs.d directory per mirrored registry
  ansible.builtin.file:
    path: "/etc/containerd/certs.d/{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ mirrored_registries | map(attribute='name') | list + [registry_host] }}"

- name: Route each upstream through its prefix in Zot
  ansible.builtin.template:
    src: hosts.toml.j2
    dest: "/etc/containerd/certs.d/{{ item.name }}/hosts.toml"
    mode: '0644'
  loop: "{{ mirrored_registries }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Restart containerd

# For images referenced as 192.168.56.1:5000/... directly.
- name: Allow plain-HTTP pulls straight from Zot
  ansible.builtin.copy:
    dest: "/etc/containerd/certs.d/{{ registry_host }}/hosts.toml"
    content: |
      server = "http://{{ registry_host }}"

      [host."http://{{ registry_host }}"]
        capabilities = ["pull", "resolve"]
    mode: '0644'
  notify: Restart containerd

# Clear stale runtime state before a node first joins. Guarded on
# kubelet.conf: unconditionally wiping /var/lib/containerd destroys every
# image and running container on a node that is already part of the cluster,
# which took the control plane down on a plain re-run.
- name: Check whether this node has already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Reset containerd state on a node that has not joined yet
  when: not kubelet_conf.stat.exists
  block:
  - name: Stop containerd
    ansible.builtin.systemd:
      name: containerd
      state: stopped

  - name: Wipe its state
    ansible.builtin.file:
      path: /var/lib/containerd
      state: absent

- name: Restart containerd on config changes
  ansible.builtin.meta: flush_handlers

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Install wait-for-hostonly systemd service (host-only NIC up before kubelet)
  ansible.builtin.copy:
    dest: /etc/systemd/system/wait-for-hostonly.service
    mode: '0644'
    content: |
      [Unit]
      Description=Wait for the host-only NIC to be ready
      Before=kubelet.service
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/bin/bash -c 'until ip -4 addr show hostonly | grep -q inet; do sleep 2; done'
      TimeoutSec=60
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target

- name: Enable wait-for-hostonly service
  ansible.builtin.systemd:
    name: wait-for-hostonly.service
    enabled: true
    daemon_reload: true

# Without --node-ip kubelet registers the NAT interface, which is 10.0.2.15 on
# every VM. All three nodes then report the same InternalIP and the apiserver
# reaches the wrong kubelet for logs, exec and metrics.
- name: Register kubelet against the host-only address
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: |
      KUBELET_EXTRA_ARGS=--node-ip={{ hostvars[inventory_hostname].ansible_host }}
    mode: '0644'
  notify: Restart kubelet

- name: Enable and start kubelet
  ansible.builtin.systemd:
    name: kubelet
    enabled: true
    state: started
