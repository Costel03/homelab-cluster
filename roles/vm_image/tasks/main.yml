---
- name: Resolve VirtualBox's machine folder
  ansible.builtin.command:
    argv: ['{{ vbox_manage }}', list, systemproperties]
  register: vbox_props
  changed_when: false

# Match line-wise: VBoxManage prints dozens of properties with CRLF endings,
# and a regex over the whole blob runs past the end of the line.
- name: Convert the machine folder to a WSL path
  ansible.builtin.command:
    argv:
    - wslpath
    - -u
    - "{{ vbox_props.stdout_lines
          | select('match', '^Default machine folder:')
          | first
          | regex_replace('^Default machine folder:\\s*', '')
          | trim }}"
  register: vbox_vm_dir_raw
  changed_when: false

# Name the cached VDI after the image it came from. A fixed name meant that
# changing cloud_image_url silently reused the previously cached release,
# because the only check is whether the file exists.
- name: Set image paths
  ansible.builtin.set_fact:
    vbox_vm_dir: "{{ vbox_vm_dir_raw.stdout | trim }}"
    base_vdi: "{{ vbox_vm_dir_raw.stdout | trim }}/_homelab-base/{{ cloud_image_url | basename | regex_replace('[.]img$', '') }}.vdi"

- name: Check whether the base VDI already exists
  ansible.builtin.stat:
    path: "{{ base_vdi }}"
  register: base_vdi_stat

- name: Build the base image
  when: not base_vdi_stat.stat.exists
  block:
  - name: Ensure the cache directory exists
    ansible.builtin.file:
      path: "{{ image_cache_dir }}"
      state: directory
      mode: '0755'

  - name: Fetch the published checksums
    ansible.builtin.uri:
      url: "{{ cloud_image_checksums }}"
      return_content: true
    register: cloud_checksums

  - name: Download the Ubuntu cloud image
    ansible.builtin.get_url:
      url: "{{ cloud_image_url }}"
      dest: "{{ image_cache_dir }}/{{ cloud_image_url | basename }}"
      checksum: "sha256:{{ cloud_checksums.content
                           | regex_search('([0-9a-f]{64}) \\*?' ~ (cloud_image_url | basename), '\\1')
                           | first }}"
      mode: '0644'

  # Converting straight onto /mnt/c is several times slower than converting on
  # the WSL filesystem and copying once.
  - name: Convert qcow2 to VDI
    ansible.builtin.command:
      argv:
      - qemu-img
      - convert
      - -f
      - qcow2
      - -O
      - vdi
      - "{{ image_cache_dir }}/{{ cloud_image_url | basename }}"
      - "{{ image_cache_dir }}/{{ cloud_image_url | basename | regex_replace('[.]img$', '') }}.vdi"
      creates: "{{ image_cache_dir }}/{{ cloud_image_url | basename | regex_replace('[.]img$', '') }}.vdi"

  - name: Ensure the VirtualBox base directory exists
    ansible.builtin.file:
      path: "{{ base_vdi | dirname }}"
      state: directory
      mode: '0755'

  - name: Stage the base VDI where VirtualBox can reach it
    ansible.builtin.copy:
      src: "{{ image_cache_dir }}/{{ cloud_image_url | basename | regex_replace('[.]img$', '') }}.vdi"
      dest: "{{ base_vdi }}"
      mode: '0644'

  - name: Drop the intermediate VDI
    ansible.builtin.file:
      path: "{{ image_cache_dir }}/{{ cloud_image_url | basename | regex_replace('[.]img$', '') }}.vdi"
      state: absent
