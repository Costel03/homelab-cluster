---
- name: Check if Kubernetes is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_config

# A half-finished kubeadm init leaves admin.conf behind, and that has to be
# cleared before a retry can work. But the check is a live API call, so a
# transient failure - a kubelet restart, a busy apiserver - used to trigger a
# full reset and re-init, which mints a NEW CA: every kubeconfig and every
# joined worker is invalidated, and a healthy cluster is destroyed by a
# re-run. Re-initialising is now opt-in.
- name: Verify control plane RBAC is healthy (requires working admin bootstrap)
  ansible.builtin.command: kubectl get nodes --request-timeout=15s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: k8s_health
  failed_when: false
  changed_when: false
  when: kubeadm_config.stat.exists
  retries: 6
  delay: 10
  until: k8s_health.rc == 0

- name: Stop rather than silently rebuild an unhealthy control plane
  ansible.builtin.fail:
    msg: >-
      The control plane is not answering and force_reinit is not set. Re-initialising
      would generate a new CA and invalidate every kubeconfig and joined node.
      Investigate first, then re-run with -e force_reinit=true to rebuild it.
  when:
  - kubeadm_config.stat.exists
  - k8s_health.rc is defined and k8s_health.rc != 0
  - not (force_reinit | default(false) | bool)

- name: Remove stale admin.conf to force a full re-init
  ansible.builtin.file:
    path: /etc/kubernetes/admin.conf
    state: absent
  when:
  - kubeadm_config.stat.exists
  - k8s_health.rc is defined and k8s_health.rc != 0
  - force_reinit | default(false) | bool

- name: Recheck initialization state after health verification
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_config

- name: Initialise the control plane
  when: not kubeadm_config.stat.exists
  block:
  - name: Wait for the containerd socket
    ansible.builtin.wait_for:
      path: /run/containerd/containerd.sock
      state: present
      timeout: 60

  - name: Reset any partial kubeadm state
    ansible.builtin.shell: |
      kubeadm reset -f
      rm -rf /etc/kubernetes/manifests /etc/kubernetes/pki /var/lib/etcd
    changed_when: true

  - name: Kill any lingering control-plane processes after reset
    ansible.builtin.shell: |
      # /proc/<pid>/comm is capped at 15 chars — use truncated names.
      # Do NOT use pkill -f: it matches the full cmdline including the
      # text of this shell script, which would kill the Ansible runner.
      pkill -9 kube-apiserver  2>/dev/null || true
      pkill -9 kube-scheduler  2>/dev/null || true
      pkill -9 kube-controller 2>/dev/null || true  # kube-controller-manager truncated to 15 chars
      pkill -9 etcd            2>/dev/null || true
    changed_when: false

  - name: Wait for control-plane ports to be free after reset
    ansible.builtin.wait_for:
      port: "{{ item }}"
      state: stopped
      timeout: 60
      delay: 2
    loop:
    - 6443   # kube-apiserver
    - 10257  # kube-controller-manager
    - 10259  # kube-scheduler
    - 2379   # etcd client
    - 2380   # etcd peer

  - name: Wait for the host-only interface to get its address
    ansible.builtin.command: ip -4 -o addr show hostonly
    register: iface_check
    until: api_advertise_address in iface_check.stdout
    retries: 24
    delay: 5
    changed_when: false

  - name: Get installed kubeadm version
    ansible.builtin.command: kubeadm version -o short
    register: kubeadm_ver
    changed_when: false

  - name: Write kubeadm init config
    ansible.builtin.copy:
      dest: /root/kubeadm-init-config.yaml
      mode: '0600'
      content: |
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: InitConfiguration
        localAPIEndpoint:
          advertiseAddress: {{ api_advertise_address }}
          bindPort: 6443
        nodeRegistration:
          criSocket: unix:///run/containerd/containerd.sock
        # Defaults assume server-grade disks. etcd here sees 200-350ms apply
        # latency on a laptop SSD shared with the workers, so the apiserver is
        # not serving within kubernetesAPICall's 1m default and init dies at the
        # bootstrap-admin phase, leaving a cluster with no admin RBAC binding.
        timeouts:
          controlPlaneComponentHealthCheck: 10m0s
          kubeletHealthCheck: 10m0s
          kubernetesAPICall: 10m0s
          etcdAPICall: 5m0s
          discovery: 5m0s
          tlsBootstrap: 10m0s
        ---
        apiVersion: kubeadm.k8s.io/v1beta4
        kind: ClusterConfiguration
        kubernetesVersion: {{ kubeadm_ver.stdout | trim }}
        networking:
          podSubnet: {{ pod_subnet }}

  # Pre-pull so kubeadm's health-check timers are not eaten by downloads.
  # These go through Zot, so a rebuild pulls them from the laptop.
  - name: Pre-pull kubeadm control-plane images
    ansible.builtin.command: kubeadm config images pull --config /root/kubeadm-init-config.yaml
    retries: 3
    delay: 10
    register: image_pull_result
    until: image_pull_result.rc == 0
    changed_when: true

  - name: Initialize Kubernetes control plane
    ansible.builtin.shell: |
      set -o pipefail
      kubeadm init --config /root/kubeadm-init-config.yaml | tee /root/kubeadm-init.out
    args:
      executable: /bin/bash
    changed_when: true

- name: Create .kube directory for the node user
  ansible.builtin.file:
    path: /home/{{ node_user }}/.kube
    state: directory
    owner: "{{ node_user }}"
    group: "{{ node_user }}"
    mode: '0755'

- name: Copy kubeconfig to the node user
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /home/{{ node_user }}/.kube/config
    remote_src: true
    owner: "{{ node_user }}"
    group: "{{ node_user }}"
    mode: '0600'

# ── Calico ───────────────────────────────────────────────────────────────────
# Kept unedited: get_url re-downloads a file GitHub serves without
# Last-Modified, so editing it in place made every run fetch, re-edit and
# re-apply it.
- name: Download the Calico manifest
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml
    dest: /root/calico-{{ calico_version }}.orig.yaml
    mode: '0644'

- name: Read it
  ansible.builtin.slurp:
    src: /root/calico-{{ calico_version }}.orig.yaml
  register: calico_orig

# Set before the first calico-node starts. Patching the DaemonSet afterwards
# raced it: the first pods autodetected the NAT NIC (10.0.2.15 on every node)
# and the default pool is created once and never changed. mandatory_count
# fails the task if Calico ever reworks the commented block this replaces.
- name: Pin the pod CIDR and the address Calico peers on
  ansible.builtin.copy:
    dest: /root/calico-{{ calico_version }}.yaml
    content: >-
      {{ calico_orig.content | b64decode
         | regex_replace(calico_pool_cidr_regex, calico_pool_cidr_replacement, multiline=True, mandatory_count=1) }}
    mode: '0644'
  vars:
    calico_pool_cidr_regex: '^( +)# - name: CALICO_IPV4POOL_CIDR\n +#   value: "[^"]*"$'
    calico_pool_cidr_replacement: '\1- name: CALICO_IPV4POOL_CIDR\n\1  value: "{{ pod_subnet }}"\n\1- name: IP_AUTODETECTION_METHOD\n\1  value: "cidr={{ cluster_cidr }}"'
  register: calico_manifest

# Server-side: Calico's CRDs exceed the client-side last-applied annotation
# limit. Re-applying an unchanged manifest is a no-op.
- name: Apply Calico
  ansible.builtin.command: kubectl apply --server-side --force-conflicts -f /root/calico-{{ calico_version }}.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: calico_apply
  until: calico_apply.rc == 0
  retries: 12
  delay: 30
  changed_when: calico_manifest is changed

# Join tokens expire. Writing the command to a file once with `creates:` meant
# every later run reused a dead token, and the workers failed with "could not
# find a JWS signature in the cluster-info ConfigMap". Mint a fresh one each
# run and hand it to the workers through hostvars instead of a file.
- name: Create a fresh join command
  ansible.builtin.command: kubeadm token create --print-join-command --ttl 1h
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: kubeadm_join_command
  changed_when: false

# ---------------------------------------------------------------------
# NFS Server — exports /share for the nfs-subdir-external-provisioner
# ---------------------------------------------------------------------
- name: Install nfs-kernel-server
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Create /share export directory
  ansible.builtin.file:
    path: /share
    state: directory
    owner: nobody
    group: nogroup
    mode: '0777'

- name: Export /share via NFS to cluster subnet
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: '/share {{ cluster_cidr }}(rw,sync,no_subtree_check,no_root_squash)'
    regexp: '^/share'
    state: present
  notify: Re-export NFS shares

- name: Enable and start nfs-kernel-server
  ansible.builtin.systemd:
    name: nfs-kernel-server
    state: started
    enabled: true
