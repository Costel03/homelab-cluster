---
# Only (re)join a worker that is not already part of the cluster. This used to
# reset and re-join every worker on every run, which evicted every pod on them
# whenever `make cluster` was re-run against a healthy cluster.

- name: Check for a kubelet config from a previous join
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: worker_kubelet_conf

- name: Ask the control plane whether it knows this node
  ansible.builtin.command:
    argv: [kubectl, --kubeconfig, /etc/kubernetes/admin.conf, get, node, '{{ inventory_hostname }}', -o, name]
  delegate_to: "{{ groups['masters'][0] }}"
  register: worker_node_known
  failed_when: false
  changed_when: false

- name: Join the cluster
  when: >-
    not worker_kubelet_conf.stat.exists
    or worker_node_known.rc != 0
    or (force_rejoin | default(false) | bool)
  block:
  - name: Reset any half-finished join
    ansible.builtin.command: kubeadm reset -f
    changed_when: true

  - name: Delete a stale node object so the join is clean
    ansible.builtin.command:
      argv: [kubectl, --kubeconfig, /etc/kubernetes/admin.conf, delete, node, '{{ inventory_hostname }}', --ignore-not-found=true]
    delegate_to: "{{ groups['masters'][0] }}"
    changed_when: false

  - name: Remove old CNI configuration
    ansible.builtin.file:
      path: /etc/cni/net.d
      state: absent

  - name: Join Kubernetes cluster
    ansible.builtin.command: "{{ hostvars[groups['masters'][0]].kubeadm_join_command.stdout }}"
    changed_when: true

  - name: Wait for kubelet to register with the control plane
    ansible.builtin.wait_for:
      path: /etc/kubernetes/kubelet.conf
      timeout: 120

- name: Create .kube directory for the node user
  ansible.builtin.file:
    path: /home/{{ node_user }}/.kube
    state: directory
    mode: '0755'
    owner: "{{ node_user }}"
    group: "{{ node_user }}"
