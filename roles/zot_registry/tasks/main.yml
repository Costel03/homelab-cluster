---
# Zot runs on the host, not in the cluster: an in-cluster registry cannot serve
# the images needed to start itself, so it would never help a cold rebuild.

- name: Locate the port-forwarding script in Windows terms
  ansible.builtin.set_fact:
    portproxy_script_win: >-
      {{ (role_path ~ '/files/publish-to-hostonly.ps1')
         | regex_replace('^/mnt/([a-zA-Z])/', '\1:/') }}

- name: Confirm systemd is PID 1 in this WSL distro
  ansible.builtin.command: ps -p 1 -o comm=
  register: wsl_init
  changed_when: false
  failed_when: wsl_init.stdout | trim != 'systemd'

- name: Install the zot binary
  ansible.builtin.get_url:
    url: "https://github.com/project-zot/zot/releases/download/{{ zot_version }}/zot-linux-amd64"
    dest: /usr/local/bin/zot
    mode: '0755'
  become: true
  notify: Restart zot

- name: Create the zot system user
  ansible.builtin.user:
    name: zot
    system: true
    home: /var/lib/zot
    shell: /usr/sbin/nologin
    create_home: false
  become: true

- name: Create the zot directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.owner | default('root') }}"
    mode: '0755'
  become: true
  loop:
  - { path: /var/lib/zot, owner: zot }
  - { path: /etc/zot }
  loop_control:
    label: "{{ item.path }}"

# Generated once and kept outside the repo; the runner role hands it to the
# CI user. Pulls stay anonymous, so nodes and ArgoCD need no credentials.
- name: Read or generate the CI push password
  ansible.builtin.set_fact:
    zot_ci_password: "{{ lookup('ansible.builtin.password', zot_ci_password_file ~ ' chars=ascii_letters,digits length=40') }}"
  no_log: true

- name: Write the htpasswd entry for the CI user
  community.general.htpasswd:
    path: /etc/zot/htpasswd
    name: "{{ zot_ci_user }}"
    password: "{{ zot_ci_password }}"
    hash_scheme: bcrypt
    owner: root
    group: zot
    mode: '0640'
  become: true
  no_log: true
  notify: Restart zot

- name: Write the zot config
  ansible.builtin.template:
    src: config.json.j2
    dest: /etc/zot/config.json
    mode: '0644'
    validate: /usr/local/bin/zot verify %s
  become: true
  notify: Restart zot

- name: Install the systemd unit
  ansible.builtin.template:
    src: zot.service.j2
    dest: /etc/systemd/system/zot.service
    mode: '0644'
  become: true
  notify: Restart zot

- name: Enable and start zot
  ansible.builtin.systemd:
    name: zot
    state: started
    enabled: true
    daemon_reload: true
  become: true

- name: Wait for zot to answer
  ansible.builtin.uri:
    url: "http://localhost:{{ registry_port }}/v2/"
    status_code: [200, 401]
  register: zot_probe
  retries: 10
  delay: 3
  until: zot_probe is succeeded

# WSL is NAT'd, so VMs on the host-only network cannot reach it directly.
# Windows forwards the host-only address to WSL's localhost relay on [::1],
# which, unlike WSL's own IP, survives WSL restarts; and a logon task keeps
# the distro running, since WSL otherwise stops it once no terminal is open.
# Both are set up once, so the UAC prompt below only appears the first time.
- name: Check the Windows side is already in place
  ansible.builtin.command:
    argv:
    - /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
    - -NoProfile
    - -Command
    - >-
      $fwd = (netsh interface portproxy show v4tov6) -match '{{ host_ip | regex_escape }}\s+{{ registry_port }}\s+::1';
      $task = Get-ScheduledTask -TaskName {{ zot_keepalive_task }} -ErrorAction SilentlyContinue;
      if ($fwd -and $task) { 'ready' } else { 'missing' }
  register: windows_side
  changed_when: false

- name: Set up the forward and the keep-alive task (accept the UAC prompt)
  when: windows_side.stdout | trim != 'ready'
  block:
  # Needs Administrator for netsh portproxy and the firewall rule, and WSL
  # cannot elevate on its own.
  - name: Run the setup script elevated
    ansible.builtin.command:
      argv:
      - /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe
      - -NoProfile
      - -Command
      - >-
        Start-Process powershell -Verb RunAs -Wait -ArgumentList
        @('-NoProfile','-ExecutionPolicy','Bypass','-File','{{ portproxy_script_win }}',
        '-Port','{{ registry_port }}',
        '-HostOnlyIp','{{ host_ip }}',
        '-Distro','{{ lookup('ansible.builtin.env', 'WSL_DISTRO_NAME') | default('Ubuntu-24.04', true) }}',
        '-TaskName','{{ zot_keepalive_task }}')
    changed_when: true

- name: Verify the registry answers on the host-only address
  ansible.builtin.uri:
    url: "http://{{ host_ip }}:{{ registry_port }}/v2/"
    status_code: [200, 401]
  register: zot_hostonly
  retries: 5
  delay: 3
  until: zot_hostonly is succeeded
