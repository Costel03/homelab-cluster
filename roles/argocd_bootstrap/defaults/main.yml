---
argocd_values:
  configs:
    cm:
      # Poll the GitOps repo every minute: GitHub cannot reach a webhook on the
      # host-only network, so polling is the only trigger.
      timeout.reconciliation: 60s
      # Since 1.8 an Application has no health of its own, so sync waves in an
      # app-of-apps only order creation and never wait. This restores it: a
      # wave now waits until the Applications before it are Healthy.
      resource.customizations.health.argoproj.io_Application: |
        hs = {}
        hs.status = "Progressing"
        hs.message = ""
        if obj.status ~= nil and obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
        return hs
  # Sized from measured use on the running cluster. No CPU limits: throttling
  # only makes probes time out (repo-server was killed six times that way).
  server:
    replicas: 1
    service:
      type: LoadBalancer
      annotations:
        metallb.io/loadBalancerIPs: 192.168.56.20
    ingress:
      enabled: false
    resources:
      requests: { cpu: 20m, memory: 48Mi }
      limits: { memory: 256Mi }
  # Holds every resource of every app in memory. It was OOMKilled at 512Mi on
  # the first full sync and sits around 270Mi after it.
  controller:
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { memory: 1Gi }
  # Rendering a dozen charts at once on a cold sync is its peak.
  repoServer:
    replicas: 1
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { memory: 768Mi }
    livenessProbe:
      timeoutSeconds: 5
  applicationSet:
    replicas: 1
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  redis:
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { memory: 64Mi }
  notifications:
    resources:
      requests: { cpu: 5m, memory: 24Mi }
      limits: { memory: 96Mi }
  # Dex is ArgoCD's SSO bridge. Login here is the local admin account.
  dex:
    enabled: false

# L2 mode only: FRR is MetalLB's BGP daemon, and it restarted eight times on
# master for nothing.
metallb_values:
  speaker:
    frr:
      enabled: false
    resources:
      requests: { cpu: 20m, memory: 24Mi }
      limits: { memory: 96Mi }
  controller:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
