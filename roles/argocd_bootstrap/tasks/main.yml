---
# MetalLB and ArgoCD are installed here rather than by ArgoCD itself: ArgoCD's
# Service is a LoadBalancer, so it stays Pending until MetalLB exists, and
# ArgoCD cannot install itself. Everything else is declared in homelab-gitops
# and reconciled from there.
#
# Manifests go through kubectl rather than kubernetes.core.k8s: that module
# needs the Python kubernetes client >= 24.2 on the controller, and Ubuntu
# 24.04 only packages 22.6.

# ArgoCD tracks the branch CI moves after publishing to Zot. Until the publish
# workflow has run once it does not exist, and every Application would sit in
# ComparisonError.
- name: Check that CI has published at least once
  ansible.builtin.command:
    argv: [git, ls-remote, --exit-code, --heads, '{{ gitops_repo_url }}', '{{ gitops_repo_revision }}']
  register: gitops_branch
  changed_when: false
  failed_when: false

- name: Stop if there is nothing for ArgoCD to sync yet
  ansible.builtin.fail:
    msg: >-
      {{ gitops_repo_url }} has no '{{ gitops_repo_revision }}' branch, so ArgoCD would have nothing
      to sync. Fill Zot and create it, either with the publish workflow (Actions > publish > Run
      workflow, all apps — needs the self-hosted runner) or by hand from WSL: run
      scripts/app.sh publish <app> for every app in homelab-gitops, then
      git push origin main:{{ gitops_repo_revision }}. Re-run make apps afterwards.
  when: gitops_branch.rc != 0

- name: Install MetalLB
  kubernetes.core.helm:
    name: metallb
    chart_ref: metallb
    chart_repo_url: https://metallb.github.io/metallb
    chart_version: "{{ metallb_chart_version }}"
    release_namespace: metallb-system
    create_namespace: true
    wait: true
    wait_timeout: 10m

# The pool and advertisement are plain CRs, so they can only be applied once
# MetalLB's CRDs are established.
- name: Wait for the MetalLB CRDs
  ansible.builtin.command:
    argv: [kubectl, wait, --for, condition=Established, crd/ipaddresspools.metallb.io, --timeout=120s]
  changed_when: false

- name: Apply the MetalLB address pool
  ansible.builtin.command:
    argv: [kubectl, apply, -f, '-']
    stdin: "{{ lookup('ansible.builtin.template', 'metallb-resources.yaml.j2') }}"
  register: metallb_pool_apply
  changed_when: "' created' in metallb_pool_apply.stdout or ' configured' in metallb_pool_apply.stdout"
  # MetalLB's webhook can lag its Deployment's readiness by a few seconds.
  retries: 6
  delay: 10
  until: metallb_pool_apply.rc == 0

- name: Install ArgoCD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo-cd
    chart_repo_url: https://argoproj.github.io/argo-helm
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: argocd
    create_namespace: true
    values: "{{ argocd_values }}"
    wait: true
    wait_timeout: 10m

- name: Wait for the Application CRD
  ansible.builtin.command:
    argv: [kubectl, wait, --for, condition=Established, crd/applications.argoproj.io, --timeout=120s]
  changed_when: false

- name: Hand the rest of the cluster to ArgoCD
  ansible.builtin.command:
    argv: [kubectl, apply, -f, '-']
    stdin: "{{ lookup('ansible.builtin.template', 'app-of-apps.yaml.j2') }}"
  register: app_of_apps_apply
  changed_when: "' created' in app_of_apps_apply.stdout or ' configured' in app_of_apps_apply.stdout"
