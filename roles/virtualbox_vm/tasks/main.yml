---
# Runs once per node, delegated to localhost. vm_name / vm_ip and the sizing
# vars come from the inventory.

- name: List existing VMs
  ansible.builtin.command:
    argv: ['{{ vbox_manage }}', list, vms]
  register: vbox_vms
  changed_when: false

- name: List running VMs
  ansible.builtin.command:
    argv: ['{{ vbox_manage }}', list, runningvms]
  register: vbox_running
  changed_when: false

# `list vms` prints '"name" {uuid}' per line. Match the line rather than
# searching the whole blob for a quoted needle: building that needle through
# YAML and then Jinja mangles the escapes, and the test silently returns false
# for a VM that plainly exists.
- name: Set VM facts
  ansible.builtin.set_fact:
    vm_exists: "{{ vbox_vms.stdout_lines | select('match', '^\"' ~ vm_name ~ '\"') | list | length > 0 }}"
    vm_is_running: "{{ vbox_running.stdout_lines | select('match', '^\"' ~ vm_name ~ '\"') | list | length > 0 }}"
    vm_mac: "{{ '080027aa%02x%02x' | format(vm_ip.split('.')[2] | int, vm_ip.split('.')[3] | int) }}"
    vm_dir: "{{ vbox_vm_dir }}/{{ vm_name }}"

# VBoxManage is a Windows binary and needs Windows paths. It accepts forward
# slashes, so translating the /mnt/<drive> prefix is enough.
- name: Derive the netplan MAC and Windows-format paths
  ansible.builtin.set_fact:
    vm_mac_colons: "{{ vm_mac | regex_replace('(..)(?!$)', '\\1:') }}"
    base_vdi_win: "{{ base_vdi | regex_replace('^/mnt/([a-zA-Z])/', '\\1:/') }}"
    vm_dir_win: "{{ vm_dir | regex_replace('^/mnt/([a-zA-Z])/', '\\1:/') }}"

- name: Create the VM
  when: not vm_exists
  block:
  - name: Register the VM with VirtualBox
    ansible.builtin.command:
      argv: ['{{ vbox_manage }}', createvm, --name, '{{ vm_name }}', --ostype, Ubuntu_64, --register]

  - name: Clone the base disk
    ansible.builtin.command:
      argv:
      - '{{ vbox_manage }}'
      - clonemedium
      - disk
      - "{{ base_vdi_win }}"
      - "{{ vm_dir_win }}/{{ vm_name }}.vdi"
      - --format
      - VDI

  - name: Resize the disk
    ansible.builtin.command:
      argv:
      - '{{ vbox_manage }}'
      - modifymedium
      - disk
      - "{{ vm_dir_win }}/{{ vm_name }}.vdi"
      - --resize
      - "{{ vm_disk_gb | int * 1024 }}"

  # Cloning registers the base disk in VirtualBox's media registry; leaving it
  # there makes the next clone fail with a UUID conflict.
  - name: Release the base disk from the media registry
    ansible.builtin.command:
      argv: ['{{ vbox_manage }}', closemedium, disk, '{{ base_vdi_win }}']
    failed_when: false

  - name: Render the cloud-init files
    ansible.builtin.template:
      src: "{{ item }}.j2"
      dest: "{{ image_cache_dir }}/{{ item }}"
      mode: '0644'
    loop: [user-data, meta-data]

  - name: Build the seed ISO
    ansible.builtin.command:
      argv:
      - cloud-localds
      - "{{ image_cache_dir }}/{{ vm_name }}-seed.iso"
      - "{{ image_cache_dir }}/user-data"
      - "{{ image_cache_dir }}/meta-data"

  - name: Place the seed ISO next to the VM
    ansible.builtin.copy:
      src: "{{ image_cache_dir }}/{{ vm_name }}-seed.iso"
      dest: "{{ vm_dir }}/seed.iso"
      mode: '0644'

  - name: Configure CPU, memory and networking
    ansible.builtin.command:
      argv:
      - '{{ vbox_manage }}'
      - modifyvm
      - '{{ vm_name }}'
      - --memory
      - "{{ vm_memory_mb }}"
      - --cpus
      - "{{ vm_cpus }}"
      - --paravirtprovider
      - hyperv
      - --nested-hw-virt
      - 'on'
      - --graphicscontroller
      - vmsvga
      - --vram
      - '16'
      - --boot1
      - disk
      - --boot2
      - none
      - --boot3
      - none
      - --boot4
      - none
      - --nic1
      - nat
      - --nic2
      - hostonly
      - --hostonlyadapter2
      - '{{ vbox_hostonly_adapter }}'
      - --macaddress2
      - '{{ vm_mac }}'

  # hostiocache=on: without it every guest fsync goes straight to the laptop
  # disk, etcd sees 200-350ms apply latency with three VMs running, and the
  # apiserver misses kubeadm's health-check window.
  - name: Add a SATA controller
    ansible.builtin.command:
      argv:
      - '{{ vbox_manage }}'
      - storagectl
      - '{{ vm_name }}'
      - --name
      - SATA
      - --add
      - sata
      - --controller
      - IntelAhci
      - --portcount
      - '2'
      - --hostiocache
      - 'on'

  - name: Attach the disk
    ansible.builtin.command:
      argv:
      - '{{ vbox_manage }}'
      - storageattach
      - '{{ vm_name }}'
      - --storagectl
      - SATA
      - --port
      - '0'
      - --device
      - '0'
      - --type
      - hdd
      - --medium
      - "{{ vm_dir_win }}/{{ vm_name }}.vdi"

  - name: Attach the seed ISO
    ansible.builtin.command:
      argv:
      - '{{ vbox_manage }}'
      - storageattach
      - '{{ vm_name }}'
      - --storagectl
      - SATA
      - --port
      - '1'
      - --device
      - '0'
      - --type
      - dvddrive
      - --medium
      - "{{ vm_dir_win }}/seed.iso"

# Sizing is only applied by modifyvm at creation, so editing group_vars would
# otherwise have no effect on a VM that already exists. Reconcile it instead,
# which means a stop/start when the numbers differ.
- name: Reconcile CPU and memory on an existing VM
  when: vm_exists
  block:
  - name: Read the VM's current sizing
    ansible.builtin.command:
      argv: ['{{ vbox_manage }}', showvminfo, '{{ vm_name }}', --machinereadable]
    register: vm_info
    changed_when: false

  - name: Extract it
    ansible.builtin.set_fact:
      current_memory: "{{ vm_info.stdout_lines | select('match', '^memory=') | first | regex_replace('^memory=\"?([0-9]+)\"?$', '\\1') | int }}"
      current_cpus: "{{ vm_info.stdout_lines | select('match', '^cpus=') | first | regex_replace('^cpus=\"?([0-9]+)\"?$', '\\1') | int }}"

  - name: Apply the new sizing
    when: current_memory | int != vm_memory_mb | int or current_cpus | int != vm_cpus | int
    block:
    - name: Report the change
      ansible.builtin.debug:
        msg: >-
          {{ vm_name }}: {{ current_cpus }} vCPU / {{ current_memory }} MB
          -> {{ vm_cpus }} vCPU / {{ vm_memory_mb }} MB (needs a restart)

    # The cloud image has no acpid, so controlvm acpipowerbutton is ignored.
    # Shut down from inside instead; the command loses its connection as the
    # host goes down, which is not a failure.
    - name: Shut the VM down from inside
      ansible.builtin.command:
        argv:
        - ssh
        - -i
        - "{{ ssh_key_path }}"
        - -o
        - BatchMode=yes
        - -o
        - StrictHostKeyChecking=no
        - -o
        - UserKnownHostsFile=/dev/null
        - -o
        - LogLevel=ERROR
        - "{{ node_user }}@{{ vm_ip }}"
        - sudo shutdown -h now
      failed_when: false
      when: vm_is_running

    - name: Wait for it to stop
      ansible.builtin.command:
        argv: ['{{ vbox_manage }}', list, runningvms]
      register: still_running
      until: still_running.stdout_lines | select('match', '^"' ~ vm_name ~ '"') | list | length == 0
      retries: 24
      delay: 5
      changed_when: false
      failed_when: false
      when: vm_is_running

    - name: Pull the power if it is still up after two minutes
      ansible.builtin.command:
        argv: ['{{ vbox_manage }}', controlvm, '{{ vm_name }}', poweroff]
      when:
      - vm_is_running
      - still_running.stdout_lines | select('match', '^"' ~ vm_name ~ '"') | list | length > 0

    - name: Let VirtualBox release the disk lock
      ansible.builtin.pause:
        seconds: 3
      when: vm_is_running

    - name: Resize
      ansible.builtin.command:
        argv:
        - '{{ vbox_manage }}'
        - modifyvm
        - '{{ vm_name }}'
        - --memory
        - "{{ vm_memory_mb }}"
        - --cpus
        - "{{ vm_cpus }}"

    - name: Note that it must be started again
      ansible.builtin.set_fact:
        vm_is_running: false

- name: Start the VM
  ansible.builtin.command:
    argv: ['{{ vbox_manage }}', startvm, '{{ vm_name }}', --type, headless]
  when: not vm_is_running
